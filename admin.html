<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מתקדם - גשר שפות עברית צרפתית</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        h2, h3 { color: var(--primary-color); margin-top: 0; }
        .hidden { display: none; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .room-link-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .rooms-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            gap: 10px;
        }
        .room-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }
        .room-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .room-actions button {
            width: auto;
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-top: 0;
        }
        .btn-success { background-color: #10b981; }
        .btn-success:hover { background-color: #059669; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <!-- מסך הזנת סיסמה -->
        <div id="login-screen" class="card" style="text-align: center;">
            <h2>🔐 כניסת מנהל מערכת</h2>
            <p>הכנס סיסמת ניהול כדי לגשת לדאשבורד:</p>
            <input type="password" id="password-input" placeholder="סיסמה (ברירת מחדל: 1234)" onkeydown="if(event.key==='Enter') checkPassword()">
            <button onclick="checkPassword()">הכנס למערכת</button>
        </div>

        <!-- דאשבורד ניהול מלא -->
        <div id="dashboard" class="card hidden">
            <a href="index.html" class="back-link">← חזרה למסך הראשי</a>
            <h2>🛠️ לוח בקרה - ניהול חדרי שיחה</h2>
            <p>צור חדר שיחה חדש, שתף לוואטסאפ או נהל את החדרים הפעילים:</p>
            
            <div style="margin-top: 20px;">
                <h3>➕ יצירת חדר חדש</h3>
                <input type="text" id="room-name-input" placeholder="שם החדר (למשל: קבוצה-א-צרפתית)" onkeydown="if(event.key==='Enter') createRoomLink()">
                <button onclick="createRoomLink()">צור קישור לחדר</button>
                
                <div id="result-area" class="hidden">
                    <div id="generated-link" class="room-link-box"></div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn-success" onclick="copyLink()" style="flex: 1;">העתק קישור 📋</button>
                        <button class="btn-whatsapp" onclick="shareWhatsApp()" style="flex: 1;">שלח בוואטסאפ 📱</button>
                    </div>
                </div>
            </div>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid #e2e8f0;">

            <div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>📋 חדרים פעילים במערכת</h3>
                    <button style="width: auto; padding: 6px 12px; margin-top: 0; font-size: 0.85rem;" onclick="loadActiveRooms()">רענן רשימה 🔄</button>
                </div>
                <div id="rooms-container" class="rooms-list">
                    <p style="color: #64748b; font-size: 0.9rem;">טוען חדרים פעילים מהענן...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq_hHRhuFu6QfvxdkrN_S0rK17hZskIfo",
            authDomain: "hebrew-french.firebaseapp.com",
            projectId: "hebrew-french",
            storageBucket: "hebrew-french.firebasestorage.app",
            messagingSenderId: "1027136444686",
            appId: "1:1027136444686:web:e02cc664abd4c1fc8adf5f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASSWORD = "1234"; // ניתן לשנות סיסמה כאן

        window.checkPassword = function() {
            const pass = document.getElementById('password-input').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadActiveRooms();
            } else {
                alert("סיסמה שגויה!");
            }
        }

        window.createRoomLink = function() {
            const roomName = document.getElementById('room-name-input').value.trim();
            if (!roomName) {
                alert("אנא הכנס שם תקין לחדר");
                return;
            }
            
            // יצירת קישור מדויק המצביע תמיד על index.html בבסיס האתר
            const currentUrl = window.location.href;
            const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1) + 'index.html';
            const fullLink = `${baseUrl}?room=${encodeURIComponent(roomName)}`;

            document.getElementById('generated-link').innerText = fullLink;
            document.getElementById('result-area').classList.remove('hidden');
            loadActiveRooms();
        }

        window.copyLink = function() {
            const linkText = document.getElementById('generated-link').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("הקישור הועתק בהצלחה!");
            });
        }

        window.shareWhatsApp = function() {
            const linkText = document.getElementById('generated-link').innerText;
            const message = encodeURIComponent(`שלום! מוזמנים להצטרף לחדר השיחה בעברית-צרפתית בקישור הבא:\n${linkText}`);
            window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
        }

        // שליפת החדרים הקיימים מהענן
        window.loadActiveRooms = async function() {
            const container = document.getElementById('rooms-container');
            container.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">טוען חדרים מהענן...</p>';

            try {
                const roomsSnapshot = await getDocs(collection(db, "rooms"));
                container.innerHTML = '';

                if (roomsSnapshot.empty) {
                    container.innerHTML = '<p style="color: #64748b; font-size: 0.9rem;">אין עדיין חדרים פעילים במסד הנתונים. צור חדר ראשון למעלה!</p>';
                    return;
                }

                roomsSnapshot.forEach((docSnap) => {
                    const roomId = docSnap.id;
                    const currentUrl = window.location.href;
                    const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1) + 'index.html';
                    const roomUrl = `${baseUrl}?room=${encodeURIComponent(roomId)}`;

                    const item = document.createElement('div');
                    item.className = 'room-item';
                    item.innerHTML = `
                        <div class="room-info">
                            <strong>🏷️ חדר: ${roomId}</strong>
                            <span style="font-size: 0.75rem; color: #64748b; word-break: break-all;">${roomUrl}</span>
                        </div>
                        <div class="room-actions">
                            <button onclick="window.open('${roomUrl}', '_blank')">הכנס 👁️</button>
                            <button class="btn-success" onclick="navigator.clipboard.writeText('${roomUrl}').then(() => alert('הקישור הועתק!'))">העתק 📋</button>
                            <button class="btn-whatsapp" onclick="window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent('הצטרפו לחדר השיחה: ${roomUrl}'), '_blank')">ואטסאפ 📱</button>
                            <button class="btn-danger" onclick="deleteRoom('${roomId}')">מחק 🗑️</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                console.error("Error loading rooms:", e);
                container.innerHTML = '<p style="color: #ef4444; font-size: 0.9rem;">שגיאה בטעינת החדרים מהענן.</p>';
            }
        };

        // מחיקת חדר מהענן (איפוס החדר)
        window.deleteRoom = async function(roomId) {
            if (confirm(`האם אתה בטוח שברצונך למחוק את החדר "${roomId}" וכל ההיסטוריה שלו?`)) {
                try {
                    await deleteDoc(doc(db, "rooms", roomId));
                    alert("החדר נמחק בהצלחה!");
                    loadActiveRooms();
                } catch (e) {
                    console.error("Error deleting room:", e);
                    alert("שגיאה במחיקת החדר.");
                }
            }
        };
    </script>
</body>
</html>
