<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גשר שפות עברית צרפתית - שיחה</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --text-color: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        #chat-window {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f1f5f9;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: relative;
        }
        .message.hebrew {
            align-self: flex-start;
            background-color: #ffffff;
            border-right: 4px solid var(--secondary-color);
        }
        .message.french {
            align-self: flex-end;
            background-color: #eff6ff;
            border-left: 4px solid var(--primary-color);
            direction: ltr;
            text-align: left;
        }
        .message .meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
            display: block;
        }
        .input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: #475569;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            resize: none;
            height: 45px;
            font-family: inherit;
            font-size: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        button.send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button.send-btn:hover {
            background-color: #1d4ed8;
        }
        button.send-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            padding: 10px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🇫🇷 גשר שפות עברית צרפתית - שיחה</h1>
        </header>

        <div id="chat-window">
            <!-- הודעות בזמן אמת -->
        </div>

        <div class="input-area">
            <div class="controls-row">
                <span>תרגום אוטומטי: <strong>🇮🇱 עברית ⇄ 🇫🇷 FR</strong></span>
                <span id="room-indicator">חדר: כללי</span>
            </div>
            <div class="input-row">
                <textarea id="message-input" placeholder="הקלד משפט בעברית או צרפתית..." onkeydown="checkEnter(event)"></textarea>
                <button id="send-btn-element" class="send-btn" onclick="sendMessage()">שלח 🚀</button>
            </div>
        </div>
        <footer>
            היחידה לקידום נוער נוף הגליל | תוכנית היל"ה
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq_hHRhuFu6QfvxdkrN_S0rK17hZskIfo",
            authDomain: "hebrew-french.firebaseapp.com",
            projectId: "hebrew-french",
            storageBucket: "hebrew-french.firebasestorage.app",
            messagingSenderId: "1027136444686",
            appId: "1:1027136444686:web:e02cc664abd4c1fc8adf5f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'general';
        document.getElementById('room-indicator').innerText = `חדר: ${roomId}`;

        const messagesRef = collection(db, "rooms", roomId, "messages");
        const q = query(messagesRef, orderBy("timestamp", "asc"));

        onSnapshot(q, (snapshot) => {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const msgDiv = document.createElement('div');
                const isHebrew = data.originalLang === 'he';
                msgDiv.className = `message ${isHebrew ? 'hebrew' : 'french'}`;
                
                msgDiv.innerHTML = `
                    <div><strong>${isHebrew ? 'IL' : 'FR'}</strong> ${escapeHtml(data.originalText)}</div>
                    <div style="margin-top: 4px; opacity: 0.85;">${escapeHtml(data.translatedText)}</div>
                    <span class="meta">${formatTime(data.timestamp)}</span>
                `;
                chatWindow.appendChild(msgDiv);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        window.sendMessage = async function() {
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn-element');
            const text = input.value.trim();
            if (!text) return;

            // ניקוי המקלדת והשבתת הכפתור מיד לתחושת מהירות וחיווי
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = 'שולח...';

            const isHebrew = /[\u0590-\u05FF]/.test(text);
            const langPair = isHebrew ? 'he|fr' : 'fr|he';

            let translatedText = "שגיאת תרגום";
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
                const data = await response.json();
                if (data && data.responseData) {
                    translatedText = data.responseData.translatedText;
                }
            } catch (e) {
                console.error("Translation error:", e);
                translatedText = "[התרגום נכשל]";
            }

            try {
                await addDoc(messagesRef, {
                    originalText: text,
                    translatedText: translatedText,
                    originalLang: isHebrew ? 'he' : 'fr',
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("Error adding message: ", e);
            } finally {
                // החזרת הכפתור למצב רגיל
                sendBtn.disabled = false;
                sendBtn.innerText = 'שלח 🚀';
                input.focus();
            }
        };

        window.checkEnter = function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        };

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'הרגע...';
            const date = timestamp.toDate();
            return date.toLocaleDateString('he-IL') + ' ' + date.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
        }
    </script>
</body>
</html>
