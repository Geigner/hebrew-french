<!-- הוסף את זה בתוך ה-<head> לשיפור SEO -->
<meta name="description" content="מערכת תרגום בזמן אמת בין עברית לצרפתית">

<!-- בתוך ה-<body> עדכן את הכפתורים עם aria-label -->
<button id="admin-login-btn" onclick="toggleAdminView()" aria-label="ניהול מנהל" class="hidden ...">⚙</button>
<button onclick="sendMessage()" id="send-btn" aria-label="שלח הודעה" class="...">...</button>

<!-- ה-Script המתוקן הכולל את הפונקציה החסרה -->
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzidajjVzi8qVITrGtUFofPkA0qmo2uISugWHSo-1pDMvMrDFOI3UBvH8s3mJyBebR7/exec";
    let localHistory = null, isSending = false, cachedAdminPassword = '';
    const currentClientId = (localStorage.getItem('bridge_client_id_fr') || 'c_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('bridge_client_id_fr', currentClientId);

    // תיקון השגיאה: הוספת הפונקציה החסרה
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    const getRoomId = () => {
        const urlParams = new URLSearchParams(window.location.search);
        let r = urlParams.get('room');
        if (!r) { 
            r = 'R-' + Math.random().toString(36).substr(2, 5).toUpperCase(); 
            window.history.replaceState({}, '', `?room=${r}`); 
        }
        return r;
    };
    const currentRoomId = getRoomId();
    document.getElementById('room-display').innerText = `חדר: ${currentRoomId}`;

    // מנגנון לחיצה ארוכה
    let adminTimer;
    const titleEl = document.getElementById('app-title');
    const gearBtn = document.getElementById('admin-login-btn');
    if (localStorage.getItem('bridge_admin_unlocked') === 'true') { gearBtn.classList.remove('hidden'); }
    
    const startTimer = () => { 
        adminTimer = setTimeout(() => { 
            gearBtn.classList.remove('hidden'); 
            localStorage.setItem('bridge_admin_unlocked', 'true'); 
            alert("מצב מנהל הופעל"); 
        }, 3000); 
    };
    titleEl.onmousedown = startTimer;
    titleEl.onmouseup = () => clearTimeout(adminTimer);
    titleEl.ontouchstart = startTimer;
    titleEl.ontouchend = () => clearTimeout(adminTimer);

    function adjustInputHeight(el) { el.style.height = ''; el.style.height = el.scrollHeight + 'px'; }
    function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

    async function callApi(action, payload = {}) {
        const q = new URLSearchParams({ action, roomId: currentRoomId, password: cachedAdminPassword, data: JSON.stringify(payload) });
        const res = await fetch(`${API_URL}?${q.toString()}`);
        const json = await res.json();
        if (json.status !== 'success') throw new Error(json.message);
        return json.data;
    }

    async function fetchHistory() {
        if (isSending) return;
        try {
            const history = await callApi('getHistory');
            if (JSON.stringify(history) !== JSON.stringify(localHistory)) { 
                localHistory = history; 
                renderChat(); 
            }
        } catch (e) { console.error(e); }
    }

    function renderChat() {
        const box = document.getElementById('chat-box');
        if (!localHistory?.length) { 
            box.innerHTML = '<div class="text-center text-slate-400 mt-20 italic">אין הודעות.</div>'; 
            return; 
        }
        const shouldScroll = box.scrollHeight - box.scrollTop <= box.clientHeight + 150;
        box.innerHTML = localHistory.map(m => {
            const isMe = m.clientId === currentClientId;
            return `<div class="chat-message-wrapper ${isMe ? 'items-end' : 'items-start'} mb-4">
                <div class="chat-bubble ${isMe ? 'bg-indigo-600 text-white' : 'bg-white text-slate-800 border border-slate-200'}">
                  <div class="text-[9px] opacity-70 mb-1 flex justify-between gap-4"><span>${isMe ? 'אני' : 'משתתף'}</span><span>${m.time}</span></div>
                  <div class="text-sm">${escapeHtml(m.original)}</div>
                  <div class="mt-2 pt-2 border-t ${isMe ? 'border-indigo-400/40 text-indigo-50' : 'border-slate-100 text-indigo-700'} font-semibold text-sm italic">${escapeHtml(m.translated)}</div>
                </div></div>`;
        }).join('');
        if (shouldScroll) box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text || isSending) return;
        isSending = true; input.value = ''; input.style.height = '';
        try { 
            localHistory = await callApi('sendMessage', { text, clientId: currentClientId }); 
            renderChat(); 
        }
        catch (e) { alert(e.message); } finally { isSending = false; }
    }

    // פונקציות ניהול (המשך הקוד שנחתך)
    function toggleAdminView() {
        if (cachedAdminPassword) openRoomsManager();
        else { const p = prompt("סיסמת מנהל:"); if (p) { cachedAdminPassword = p; openRoomsManager(); } }
    }

    async function openRoomsManager() {
        const container = document.getElementById('rooms-list-container');
        document.getElementById('rooms-modal').classList.remove('hidden');
        container.innerHTML = '<div class="text-center p-10 italic text-slate-400">טוען...</div>';
        try {
            const rooms = await callApi('getRoomsList');
            renderRoomsList(rooms);
        } catch (e) { alert("סיסמה שגויה"); cachedAdminPassword = ''; closeRoomsManager(); }
    }

    function renderRoomsList(rooms) {
        const container = document.getElementById('rooms-list-container');
        container.innerHTML = rooms.map(r => `
            <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                <div class="truncate flex-1">
                    <div class="text-xs font-bold text-indigo-700">${r.id}</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="copySpecificRoomLink('?room=${r.id}')" class="text-[10px] bg-slate-200 p-1 rounded">העתק</button>
                    <a href="?room=${r.id}" class="text-[10px] bg-indigo-100 p-1 rounded">כנס</a>
                </div>
            </div>`).join('');
    }

    function closeRoomsManager() { document.getElementById('rooms-modal').classList.add('hidden'); }
    
    // פוקוס אוטומטי בטעינה
    window.onload = () => {
        document.getElementById('message-input').focus();
        fetchHistory();
        setInterval(fetchHistory, 4000);
    };
</script>
