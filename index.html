<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גשר שפות: עברית ⇄ צרפתית</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #333;
            margin: 5px 0 10px 0;
            font-size: 1.4rem;
        }
        #user-bar {
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        #user-bar span.change-name {
            color: #0d6efd;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            margin-bottom: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-card {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message-card.mine {
            background-color: #e3f2fd;
            margin-right: auto;
            border-left: 4px solid #1976d2;
        }
        .message-card.other {
            background-color: #fce4ec;
            margin-left: auto;
            border-right: 4px solid #c2185b;
        }
        .msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .msg-original {
            font-size: 1rem;
            color: #222;
            margin-bottom: 4px;
        }
        .msg-translated {
            font-size: 0.95rem;
            color: #0d47a1;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 4px;
            font-weight: 600;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            height: 45px;
            font-family: Arial, sans-serif;
            font-size: 1rem;
        }
        button {
            padding: 0 20px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        button:hover { background-color: #0b5ed7; }
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            border-top: 1px solid #ddd;
            padding-top: 5px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <h2>גשר שפות: עברית ⇄ צרפתית</h2>
    
    <div id="user-bar">
        <div>השם שלך: <strong id="current-username">משתמש</strong></div>
        <span class="change-name" onclick="changeUsername()">שנה שם</span>
    </div>

    <div id="chat-container">
        <div style="text-align: center; color: #888; margin-top: 20px;">טוען הודעות...</div>
    </div>

    <div id="input-container">
        <textarea id="message-input" placeholder="הקלד עברית או צרפתית (Enter לשליחה)..." onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()" id="send-btn">שליחה</button>
    </div>

    <footer>
        היחידה לקידום נוער נוף הגליל | תוכנית היל"ה<br>
        © תשפ"ז | גיא אייגנר – מנהל השכלה | פיתוח וניהול פדגוגי
    </footer>

    <script>
        // ניהול מזהה מכשיר ושם משתמש
        let clientId = localStorage.getItem('bridge_client_id_fr');
        if (!clientId) {
            clientId = 'id_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('bridge_client_id_fr', clientId);
        }

        let username = localStorage.getItem('bridge_username_fr');
        if (!username) {
            username = 'משתמש ' + Math.floor(Math.random() * 100);
            localStorage.setItem('bridge_username_fr', username);
        }
        document.getElementById('current-username').innerText = username;

        function changeUsername() {
            let newName = prompt("הכנס את שמך החדש:", username);
            if (newName && newName.trim() !== "") {
                username = newName.trim();
                localStorage.setItem('bridge_username_fr', username);
                document.getElementById('current-username').innerText = username;
            }
        }

        // ניהול חדרים דרך ה-URL
        function getRoomId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('room') || 'default_room';
        }
        const roomId = getRoomId();

        let displayedIds = new Set();
        let isFirstLoad = true;

        function fetchMessages() {
            google.script.run
                .withSuccessHandler(updateUI)
                .withFailureHandler(err => console.error(err))
                .getMessages(roomId);
        }

        function updateUI(messages) {
            if (!messages || !Array.isArray(messages)) return;
            const container = document.getElementById('chat-container');
            
            if (isFirstLoad) {
                container.innerHTML = '';
            }

            let hasNew = false;
            messages.forEach(msg => {
                if (!displayedIds.has(msg.id)) {
                    displayedIds.add(msg.id);
                    hasNew = true;

                    const isMine = (msg.senderId === clientId);
                    const card = document.createElement('div');
                    card.className = 'message-card ' + (isMine ? 'mine' : 'other');
                    card.setAttribute('data-id', msg.id);

                    card.innerHTML = `
                        <div class="msg-header">
                            <span>${escapeHtml(msg.senderName)} ${isMine ? '(אני)' : ''}</span>
                            <span>${msg.time || ''}</span>
                        </div>
                        <div class="msg-original" dir="auto">${escapeHtml(msg.text)}</div>
                        <div class="msg-translated" dir="auto">${escapeHtml(msg.translated)}</div>
                    `;
                    container.appendChild(card);
                }
            });

            if (hasNew || isFirstLoad) {
                container.scrollTop = container.scrollHeight;
                isFirstLoad = false;
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            document.getElementById('send-btn').disabled = true;

            google.script.run
                .withSuccessHandler(messages => {
                    updateUI(messages);
                    document.getElementById('send-btn').disabled = false;
                    document.getElementById('message-input').focus();
                })
                .withFailureHandler(err => {
                    alert("שגיאה בשליחה");
                    document.getElementById('send-btn').disabled = false;
                })
                .saveMessage({
                    text: text,
                    senderId: clientId,
                    senderName: username
                }, roomId);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // טעינה ראשונית ורענון מהיר ברקע כל 2 שניות
        fetchMessages();
        setInterval(fetchMessages, 2000);
    </script>
</body>
</html>
