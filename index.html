<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גשר שפות - תרגום בזמן אמת</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* תיקון פריסת עמוד ראשית */
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background-color: #f8fafc; /* bg-slate-50 */
    }

    header {
      flex-shrink: 0;
      width: 100%;
      z-index: 10;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      max-width: 56rem; /* 4xl */
      margin-left: auto;
      margin-right: auto;
    }

    /* יישור הודעות לצד ימין */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      direction: rtl;
    }

    .chat-message-wrapper {
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* ימין ב-RTL */
      width: 100%;
    }

    .chat-bubble {
      align-self: flex-start;
      max-width: 85%;
      width: fit-content;
      word-wrap: break-word;
      padding: 0.75rem;
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    /* עיצוב כפתורים נוספים */
    .add-room-btn {
      background-color: #10b981;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: bold;
      transition: all 0.2s;
    }
    .add-room-btn:hover { background-color: #059669; }

    .copy-room-btn {
      background-color: #e2e8f0;
      color: #334155;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .copy-room-btn:hover { background-color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50">

  <header class="bg-indigo-700 text-white shadow-md p-3 sm:p-4 flex justify-between items-center">
    <div class="flex flex-col">
      <h1 class="text-base sm:text-lg font-bold leading-tight">גשר שפות: עברית ⇄ צרפתית</h1>
      <span class="text-[10px] text-indigo-100" id="room-display">חדר: טוען...</span>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="toggleAdminView()" class="bg-indigo-800 p-2 rounded-lg border border-indigo-500 hover:bg-indigo-900 transition">⚙</button>
      <div id="admin-controls" class="flex items-center gap-1.5 bg-indigo-900/40 p-1 rounded-lg border border-white/20 hidden">
        <button onclick="copyCurrentRoomLink()" class="text-xs px-2 py-1.5 bg-indigo-600 rounded hover:bg-indigo-500 transition">העתק קישור</button>
        <button onclick="openRoomsManager()" class="text-xs px-2 py-1.5 bg-amber-600 rounded hover:bg-amber-500 transition">ניהול חדרים</button>
      </div>
    </div>
  </header>

  <main>
    <div id="chat-box">
      <!-- ההודעות יתווספו כאן דינמית -->
      <div class="text-center text-slate-400 mt-20 p-6 border-2 border-dashed border-slate-200 rounded-2xl mx-4 italic">
        אין הודעות בחדר זה. כתבו הודעה ראשונה למטה!
      </div>
    </div>

    <!-- אזור הקלט -->
    <div class="p-3 bg-white border-t border-slate-200 shadow-sm z-20">
      <div class="flex gap-2 items-end max-w-4xl mx-auto">
        <textarea id="message-input" rows="1" placeholder="הקלד הודעה לתרגום..." class="flex-1 border border-slate-300 rounded-2xl p-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none bg-slate-50"></textarea>
        <button onclick="sendMessage()" class="bg-indigo-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md hover:bg-indigo-700 transition-all active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 rotate-180">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"></path>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- מודאל ניהול חדרים -->
  <div id="rooms-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="font-bold text-slate-800">ניהול חדרים פעילים</h3>
        <button onclick="closeRoomsManager()" class="text-slate-400 text-2xl">✕</button>
      </div>
      <div id="rooms-list-container" class="overflow-y-auto flex-1 flex flex-col gap-2">
        <!-- רשימת חדרים תטען כאן -->
      </div>
      <div class="mt-4 pt-3 border-t flex justify-between gap-2">
         <button onclick="createNewRoom()" class="add-room-btn">+ חדר חדש</button>
         <div>
           <button onclick="clearCurrentChat()" class="text-rose-600 text-xs font-bold border border-rose-100 px-3 py-2 rounded-lg hover:bg-rose-50 ml-2">איפוס חדר</button>
           <button onclick="closeRoomsManager()" class="bg-slate-100 px-4 py-2 rounded-lg text-xs font-bold">סגור</button>
         </div>
      </div>
    </div>
  </div>

  <script>
    // פונקציות עזר
    function toggleAdminView() {
      document.getElementById('admin-controls').classList.toggle('hidden');
    }

    function openRoomsManager() {
      document.getElementById('rooms-modal').classList.remove('hidden');
      // כאן יש להוסיף לוגיקה לטעינת החדרים לתוך rooms-list-container
    }

    function closeRoomsManager() {
      document.getElementById('rooms-modal').classList.add('hidden');
    }

    function createNewRoom() {
      window.location.href = window.location.origin + window.location.pathname;
    }

    function copyCurrentRoomLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("קישור לחדר הועתק!");
      });
    }

    // פונקציה להוספה דינמית של כפתור העתקה ברשימת החדרים
    function addCopyButtonToRoomItem(container, roomUrl) {
      const btn = document.createElement('button');
      btn.className = 'copy-room-btn';
      btn.innerText = 'העתק';
      btn.onclick = () => {
        navigator.clipboard.writeText(roomUrl);
        btn.innerText = 'הועתק!';
        setTimeout(() => btn.innerText = 'העתק', 2000);
      };
      container.appendChild(btn);
    }
  </script>
</body>
</html>
